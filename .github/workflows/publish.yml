name: Publish Packages to NPM

on:
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  publish:
    name: Build & Publish Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint source code
        run: bun run lint

      - name: Run unit tests
        run: bun test

      - name: Verify TypeScript types
        run: bun run check-types

      - name: Build distribution packages
        run: bun run build

      - name: Setup Node.js for npm publish authentication
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Publish @fluentez/hooks if version is updated
        run: |
          cd packages/hooks
          SHOULD_PUBLISH=$(node -e "
            const localVer = require('./package.json').version.trim();
            const { execSync } = require('child_process');
            try {
              const npmVer = execSync('npm view @fluentez/hooks version', { encoding: 'utf8' }).trim();
              console.log(localVer !== npmVer ? 'true' : 'false');
            } catch (e) {
              console.log('true');
            }
          ")

          if [ "$SHOULD_PUBLISH" = "true" ]; then
            echo "Publishing new version of @fluentez/hooks to NPM..."
            npm publish --access public
          else
            echo "@fluentez/hooks version is already published on NPM. Skipping publish."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
