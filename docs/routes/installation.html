<section class="route-view active" data-route="installation">
    <div class="section">
        <p class="eyebrow">Getting started</p>
        <h1>Install Packages</h1>
        <p class="lede">Choose your favorite package manager to install Fluentez libraries.</p>

        <div class="tabs" role="tablist" aria-label="Package managers">
            <button class="tab active" role="tab" aria-selected="true" data-command="npm install @fluentez/hooks @fluentez/ui">npm</button>
            <button class="tab" role="tab" aria-selected="false" data-command="pnpm add @fluentez/hooks @fluentez/ui">pnpm</button>
            <button class="tab" role="tab" aria-selected="false" data-command="bun add @fluentez/hooks @fluentez/ui">bun</button>
            <button class="tab" role="tab" aria-selected="false" data-command="yarn add @fluentez/hooks @fluentez/ui">yarn</button>
        </div>
        <pre class="code-block"><code><span class="code-prompt">$</span> <span id="install-command">npm install @fluentez/hooks @fluentez/ui</span></code><button class="copy-button" aria-label="Copy installation command">Copy</button></pre>
    </div>
